[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vending"
version = "0.1.0"
description = "Control software for the quail-egg & honey vending machine"
requires-python = ">=3.11"
dependencies = []            # M1 runs on the stdlib only

[project.optional-dependencies]
hw = ["pyserial>=3.5"]                                   # Pi <-> ESP32 UART (termios fallback exists)
payment = ["httpx>=0.27"]                                # M2
ui = ["pygame>=2.5", "segno>=1.6"]                       # M2
web = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1"] # M3
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
vending-service = "vending.core.service_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["firmware/esp32/main.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "firmware/esp32", "../cad/lib"]
