[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vending"
version = "0.1.0"
description = "Control software for the quail-egg & honey vending machine"
requires-python = ">=3.11"
dependencies = []            # M1 runs on the stdlib only

[project.optional-dependencies]
# Not pip-installed: on the Pi these come from apt (ADR 0010), HTTPS via stdlib urllib.
hw = ["pyserial>=3.5"]                                   # apt python3-serial (termios fallback exists)
ui = ["pygame>=2.5", "segno>=1.6"]                       # M2, apt python3-pygame python3-segno
dev = ["pytest>=8", "ruff>=0.5"]                         # ruff via pipx

[project.scripts]
vending-service = "vending.core.service_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["firmware/esp32/main.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "firmware/esp32", "../cad/lib"]
