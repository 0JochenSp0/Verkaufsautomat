# Usage: docker compose run --rm vending <command>   (see CLAUDE.md / README.md)
services:
  vending:
    build: .
    image: verkaufsautomat:dev
    # ADR 0008: full device access (UART, GPIO, later 1-Wire, display). Revisit before M4.
    privileged: true
    volumes:
      - ./:/app
      - ./data:/data
    # M2: long-running sales app with `restart: unless-stopped` and a healthcheck.
